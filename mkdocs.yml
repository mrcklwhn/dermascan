site_name: Dermascan Documentation

docs_dir: docs

theme:
  name: material
  features:
    - navigation.sections
    - toc.integrate

markdown_extensions:
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format

nav:
  - Home: index.md
  - App-Entwicklung: ./app/README.md
  - App-Features: ./app/features.md
  - App-Architektur: ./app/architecture.md
  - Datenbank: ./db/README.md
  - Machine Learning: ./ml/README.md
  - Multibranch Architektur: ./ml/multibranch_architecture.md
  - Pipeline: ./ml/pipeline/README.md
  - Modell Export: ./ml/onnx_export.md
  - Auditierung: ./ml/auditing.md
  - Trainingsergebnisse: ./ml/training_results.md
  - ABC Algorithmen: ./abc_algorithms/README.md
  - Läsionsmasken: ./abc_algorithms/lesion_cutout.md

