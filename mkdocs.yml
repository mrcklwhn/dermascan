site_name: Dermascan Documentation

docs_dir: docs

use_directory_urls: false

theme:
  name: material
  features:
    - navigation.sections
    - toc.integrate

markdown_extensions:
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format

nav:
  - Startseite: index.md
  - Glossar: glossar.md
  - App:
    - App-Entwicklung: ./app/README.md
    - App-Features: ./app/features.md
    - App-Architektur: ./app/architecture.md
  - Datenbank:
    - Datenhaltung und Backend-Architektur: ./db/README.md
  - Machine Learning:
    - Machine Learning: ./ml/README.md
    - Multibranch-Architektur: ./ml/multibranch_architecture.md
    - Trainingspipeline: ./ml/pipeline.md
    - ONNX-Export: ./ml/onnx_export.md
    - Auditing: ./ml/auditing.md
    - Trainingsergebnisse: ./ml/experiment_results.md
  - ABC-Algorithmen:
    - ABC-Algorithmen: ./abc_algorithms/README.md
    - Läsionssegmentierung: ./abc_algorithms/lesion_cutout.md

