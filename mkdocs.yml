site_name: Dermascan Documentation

docs_dir: docs

theme:
  name: material
  features:
    - navigation.sections
    - toc.integrate

markdown_extensions:
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format

nav:
  - Home: index.md
  - Flutter App: ./app/README.md
  - Datenbank: ./db/README.md
  - Machine Learning: ./ml/README.md
  - ABC Algorithmen: ./ml/abc_algorithms.md
  - Multibranch Architektur: ./ml/multibranch_architecture.md
  - Modell Export: ./ml/onnx_export.md
  - Läsionsmasken: ./ml/lesion_cutout.md

