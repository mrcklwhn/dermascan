name: dermascan
description: "This app allows for the photography and recording of skin abnormalities and provides an initial, non-clinical assessment of whether further urgent investigation is recommended."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter

  flutter_localizations:
    sdk: flutter

  get: ^4.7.3
  supabase_flutter: ^2.12.4
  http: ^1.6.0
  path_drawing: ^1.0.1
  svg_path_parser: ^1.1.2
  intl: ^0.20.2
  flutter_onnxruntime: ^1.7.0
  dartcv4: ^2.2.1+4
  image_picker: ^1.2.2
  uuid: ^4.5.3
  circle_flags: ^5.0.1
  image_cropper: ^12.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/
    - assets/models/
