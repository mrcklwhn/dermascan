name: dermascan
description: "This app allows for the photography and recording of skin abnormalities and provides an initial, non-clinical assessment of whether further urgent investigation is recommended."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter

  flutter_localizations:
    sdk: flutter

  get: ^4.7.3
  supabase_flutter: ^2.12.2
  http: ^1.6.0
  equatable: ^2.0.8
  path_drawing: ^1.0.1
  svg_path_parser: ^1.1.2
  intl: ^0.20.2

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/