name: dermascan
description: "This app allows for the photography and recording of skin abnormalities and provides an initial, non-clinical assessment of whether further urgent investigation is recommended."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter

  flutter_localizations:
    sdk: flutter

  get: ^4.7.3
  supabase_flutter: ^2.10.3
  flutter_secure_storage: ^9.2.4
  http: ^1.5.0
  human_body_selector:
    git:
      url: https://github.com/mrcklwhn/human_body_selector.git
      ref: main
  intl:

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^5.0.0

flutter:

  uses-material-design: true