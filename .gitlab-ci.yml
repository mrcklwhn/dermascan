stages:
  - deploy

pages:
  stage: deploy

  before_script:
    - python3 -m venv venv
    - source venv/bin/activate
    - pip install --upgrade pip
    - pip install mkdocs-material

  script:
    - source venv/bin/activate
    - mkdocs build --site-dir public

  artifacts:
    paths:
      - public

  rules:
    # Trigger pipeline on any push to any branch
    - if: '$CI_COMMIT_BRANCH'